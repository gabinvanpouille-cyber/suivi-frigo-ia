[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# ---------------------------------------------------------------------
# Tâche planifiée : rappels 8h / 13h30 et alerte 18h.
# Elle tourne toutes les 30 minutes (heure UTC) et compare l'heure locale
# de chaque ferme aux horaires configurés — insensible au changement d'heure.
# ---------------------------------------------------------------------
[functions."cron-notifications"]
  schedule = "*/30 * * * *"

# Le service worker ne doit jamais être mis en cache par le CDN,
# sinon les mises à jour de l'application ne sont jamais reçues.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Application monopage : toutes les routes retombent sur index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
